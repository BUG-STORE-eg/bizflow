<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BizFlow - انتظار المراجعة</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Tahoma, sans-serif;

            background: #0b0f17;

            color: #fff;
        }

        .container {
            width: min(520px, 92%);
        }

        .logo {
            text-align: center;

            font-size: 32px;

            font-weight: 800;

            margin-bottom: 25px;
        }

        .logo span {
            color: #38bdf8;
        }

        .card {
            background: #111827;

            border: 1px solid #263244;

            border-radius: 18px;

            padding: 35px 25px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, .3);
        }

        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #0c1d2b;

            border: 2px solid #38bdf8;

            font-size: 35px;
        }

        h1 {
            margin: 0 0 15px;

            font-size: 26px;
        }

        .success {
            color: #22c55e;

            font-size: 18px;

            font-weight: 800;

            margin-bottom: 18px;
        }

        .description {
            color: #94a3b8;

            line-height: 1.9;

            font-size: 15px;

            margin-bottom: 25px;
        }

        .status {
            background: #0b1220;

            border: 1px solid #263244;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 20px;
        }

        .status-title {
            color: #94a3b8;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .status-value {
            color: #facc15;

            font-size: 17px;

            font-weight: 800;
        }

        .info {
            color: #64748b;

            font-size: 13px;

            line-height: 1.8;

            margin-bottom: 25px;
        }

        .btn {
            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .logout {
            width: 100%;

            margin-top: 10px;

            padding: 12px;

            border: 0;

            border-radius: 10px;

            background: #334155;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }

        .logout:hover {
            background: #475569;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        Biz<span>Flow</span>
    </div>


    <div class="card">


        <div class="icon">
            ⏳
        </div>


        <h1>
            تم إرسال طلبك
        </h1>


        <div class="success">
            ✓ تم استلام طلب الدفع بنجاح
        </div>


        <div class="description">

            تم إرسال إثبات الدفع إلى الإدارة بنجاح.

            <br>

            سيتم مراجعة طلبك والتأكد من عملية الدفع،
            وبعد الموافقة سيتم تفعيل اشتراكك.

        </div>


        <div class="status">

            <div class="status-title">
                حالة الطلب
            </div>

            <div class="status-value">
                ⏳ في انتظار مراجعة الإدارة
            </div>

        </div>


        <div class="info">

            يمكنك العودة للصفحة الرئيسية لاحقًا
            لمتابعة حالة اشتراكك.

        </div>


        <button
            class="btn"
            type="button"
            onclick="window.location.href='index.html'"
        >
            العودة للصفحة الرئيسية
        </button>


        <button
            class="logout"
            type="button"
            onclick="logoutUser()"
        >
            تسجيل الخروج
        </button>


    </div>


</div>


<script>

async function logoutUser() {

    try {

        if (
            window.BizFlowAuth &&
            window.BizFlowAuth.logout
        ) {

            await window.BizFlowAuth.logout();

        } else {

            window.location.href =
                "login.html";

        }

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

        window.location.href =
            "login.html";

    }

}

</script>


</body>

</html>
