<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BizFlow - لوحة التحكم</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar">

    <div class="brand">
      Biz<span>Flow</span>
    </div>


    <nav>

      <a
        class="active"
        href="#"
      >
        📊 الرئيسية
      </a>

      <a href="#">
        👥 العملاء
      </a>

      <a href="#">
        📦 المنتجات
      </a>

      <a href="#">
        🧾 المبيعات
      </a>

      <a href="#">
        💸 المصروفات
      </a>

      <a href="#">
        📈 التقارير
      </a>

    </nav>


    <button
      id="logoutBtn"
      class="logout"
      type="button"
    >
      تسجيل الخروج
    </button>

  </aside>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">


    <!-- TOP BAR -->

    <header class="topbar">

      <div>

        <p class="welcome">
          أهلاً بك 👋
        </p>

        <h1>
          لوحة التحكم
        </h1>

      </div>


      <div
        class="user"
        id="userEmail"
      >
        جاري التحميل...
      </div>

    </header>


    <!-- =========================
         CARDS
    ========================== -->

    <section class="cards">


      <div class="card">

        <span>
          إجمالي المبيعات
        </span>

        <strong>
          0 ج.م
        </strong>

        <small>
          هذا الشهر
        </small>

      </div>


      <div class="card">

        <span>
          الأرباح
        </span>

        <strong>
          0 ج.م
        </strong>

        <small>
          هذا الشهر
        </small>

      </div>


      <div class="card">

        <span>
          العملاء
        </span>

        <strong>
          0
        </strong>

        <small>
          عميل
        </small>

      </div>


      <div class="card">

        <span>
          المنتجات
        </span>

        <strong>
          0
        </strong>

        <small>
          منتج
        </small>

      </div>


    </section>


    <!-- =========================
         SALES
    ========================== -->

    <section class="panel">


      <div class="panel-head">

        <h2>
          آخر المبيعات
        </h2>


        <button
          class="primary"
          type="button"
        >
          + إضافة عملية بيع
        </button>

      </div>


      <div class="empty">

        <div class="empty-icon">
          🧾
        </div>

        <h3>
          لا توجد مبيعات حتى الآن
        </h3>

        <p>
          عند إضافة أول عملية بيع ستظهر هنا.
        </p>

      </div>


    </section>


  </main>


  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- AUTH -->

  <script src="js/auth.js"></script>


  <!-- APP -->

  <script src="js/app.js"></script>


  <!-- =========================
       SHOW USER EMAIL
  ========================== -->

  <script>

    async function loadUserEmail() {

      const {
        data,
        error
      } = await supabaseClient.auth.getUser();


      if (error || !data.user) {

        window.location.href = "login.html";

        return;

      }


      const userEmail =
        document.getElementById("userEmail");


      if (userEmail) {

        userEmail.textContent =
          data.user.email;

      }

    }


    loadUserEmail();

  </script>


</body>

</html>
