<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BizFlow - الدفع</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/auth.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #fff;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        .box {
            background: #151923;
            border: 1px solid #292f3d;
            border-radius: 20px;
            padding: 28px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo span {
            color: #4f8cff;
        }

        .plan {
            background: #10141d;
            border: 1px solid #292f3d;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 22px;
        }

        .plan-name {
            color: #8f97a8;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
            margin-top: 8px;
        }

        .payment-number {
            background: #202636;
            border-radius: 12px;
            padding: 18px;
            margin: 20px 0;
        }

        .payment-number strong {
            display: block;
            font-size: 24px;
            direction: ltr;
            text-align: center;
            margin-top: 8px;
        }

        label {
            display: block;
            color: #b8beca;
            margin: 15px 0 8px;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            background: #0f1117;
            border: 1px solid #2a3040;
            border-radius: 10px;
            color: #fff;
            outline: none;
        }

        input[type="file"] {
            padding: 10px;
        }

        button {
            width: 100%;
            border: 0;
            padding: 14px;
            border-radius: 10px;
            background: #4f8cff;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .back {
            background: #272c38;
        }

        .error,
        .success {
            display: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .error {
            background: #3b2024;
            color: #ff9ca5;
        }

        .success {
            background: #173526;
            color: #8de0ad;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <div class="logo">
            Biz<span>Flow</span>
        </div>


        <div
            id="errorBox"
            class="error"
        ></div>


        <div
            id="successBox"
            class="success"
        ></div>


        <div class="plan">

            <div class="plan-name">
                الباقة المختارة
            </div>

            <div
                id="planName"
                class="amount"
            >
                -
            </div>

            <div
                id="planAmount"
                style="color:#8f97a8;margin-top:8px;"
            >
                -
            </div>

        </div>


        <div class="payment-number">

            <div>
                رقم التحويل:
            </div>

            <strong>
                01125035655
            </strong>

            <div
                style="
                    color:#8f97a8;
                    text-align:center;
                    margin-top:8px;
                "
            >
                Etisalat Cash / InstaPay
            </div>

        </div>


        <form id="paymentForm">

            <label>
                طريقة الدفع
            </label>

            <select
                id="paymentMethod"
                required
            >

                <option value="">
                    اختر طريقة الدفع
                </option>

                <option value="etisalat_cash">
                    Etisalat Cash
                </option>

                <option value="instapay">
                    InstaPay
                </option>

            </select>


            <label>
                رقم العملية - اختياري
            </label>

            <input
                id="transactionId"
                type="text"
                placeholder="رقم العملية"
            >


            <label>
                صورة إثبات الدفع
            </label>

            <input
                id="proof"
                type="file"
                accept="image/*"
                required
            >


            <button
                id="submitBtn"
                type="submit"
            >
                إرسال طلب الاشتراك
            </button>

        </form>


        <button
            class="back"
            onclick="window.location.href='plans.html'"
        >
            العودة للباقات
        </button>

    </div>

</div>


<script>

const supabaseClient =
    BizFlowAuth.supabaseClient;


let currentUser = null;


let selectedPlan =
    localStorage.getItem(
        "bizflow_selected_plan"
    );

let selectedAmount =
    Number(
        localStorage.getItem(
            "bizflow_selected_amount"
        )
    );


const planName =
    document.getElementById(
        "planName"
    );

const planAmount =
    document.getElementById(
        "planAmount"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const successBox =
    document.getElementById(
        "successBox"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );


function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

    successBox.style.display =
        "none";

}


function showSuccess(message) {

    successBox.textContent =
        message;

    successBox.style.display =
        "block";

    errorBox.style.display =
        "none";

}


async function initPayment() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    if (
        error ||
        !data ||
        !data.user
    ) {

        window.location.href =
            "login.html";

        return;
    }


    currentUser =
        data.user;


    if (
        !selectedPlan ||
        !selectedAmount
    ) {

        window.location.href =
            "plans.html";

        return;
    }


    planName.textContent =
        selectedPlan;


    planAmount.textContent =
        selectedAmount +
        " ج.م / شهر";

}


document
    .getElementById(
        "paymentForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            showError("");

            errorBox.style.display =
                "none";

            successBox.style.display =
                "none";


            const paymentMethod =
                document
                    .getElementById(
                        "paymentMethod"
                    )
                    .value;


            const transactionId =
                document
                    .getElementById(
                        "transactionId"
                    )
                    .value
                    .trim();


            const proofFile =
                document
                    .getElementById(
                        "proof"
                    )
                    .files[0];


            if (!paymentMethod) {

                showError(
                    "اختر طريقة الدفع."
                );

                return;

            }


            if (!proofFile) {

                showError(
                    "ارفع صورة إثبات الدفع."
                );

                return;

            }


            if (
                !proofFile.type.startsWith(
                    "image/"
                )
            ) {

                showError(
                    "الملف يجب أن يكون صورة."
                );

                return;

            }


            if (
                proofFile.size >
                5 * 1024 * 1024
            ) {

                showError(
                    "حجم الصورة يجب ألا يتجاوز 5MB."
                );

                return;

            }


            submitBtn.disabled =
                true;

            submitBtn.textContent =
                "جاري إرسال الطلب...";


            try {

                /*
                    مسار الملف:

                    user-id /
                    timestamp-file-name
                */

                const safeName =
                    proofFile.name
                        .replace(
                            /[^a-zA-Z0-9._-]/g,
                            "_"
                        );


                const filePath =
                    currentUser.id +
                    "/" +
                    Date.now() +
                    "-" +
                    safeName;


                const {
                    error:
                        uploadError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            "payment-proofs"
                        )
                        .upload(
                            filePath,
                            proofFile,
                            {
                                upsert: false
                            }
                        );


                if (uploadError) {

                    throw uploadError;

                }


                const {
                    error:
                        requestError
                } =
                    await supabaseClient
                        .from(
                            "payment_requests"
                        )
                        .insert({

                            user_id:
                                currentUser.id,

                            plan:
                                selectedPlan,

                            amount:
                                selectedAmount,

                            payment_method:
                                paymentMethod,

                            transaction_id:
                                transactionId ||
                                null,

                            proof_path:
                                filePath,

                            status:
                                "pending"

                        });


                if (requestError) {

                    throw requestError;

                }


                localStorage.removeItem(
                    "bizflow_selected_plan"
                );

                localStorage.removeItem(
                    "bizflow_selected_amount"
                );


                showSuccess(
                    "تم إرسال طلب الاشتراك بنجاح. طلبك الآن قيد المراجعة من الإدارة."
                );


                submitBtn.textContent =
                    "تم إرسال الطلب";


                setTimeout(() => {

                    window.location.href =
                        "plans.html";

                }, 1800);


            } catch (error) {

                console.error(error);


                showError(
                    error.message ||
                    "حدث خطأ أثناء إرسال الطلب."
                );


                submitBtn.disabled =
                    false;

                submitBtn.textContent =
                    "إرسال طلب الاشتراك";

            }

        }
    );


initPayment();

</script>

</body>
</html>
