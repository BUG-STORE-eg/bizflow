<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BizFlow - الدفع</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background: #0b1020;
      color: #eef2ff;
    }

    .container {
      width: min(850px, 92%);
      margin: auto;
      padding: 40px 0;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .logo span {
      color: #5b8cff;
    }

    .card {
      background: #11182b;
      border: 1px solid #202a42;
      border-radius: 18px;
      padding: 30px;
      margin-bottom: 20px;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #8794b3;
      margin-bottom: 25px;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .plan {
      border: 1px solid #293652;
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: .2s;
    }

    .plan:hover {
      border-color: #5b8cff;
    }

    .plan.selected {
      border-color: #5b8cff;
      background: rgba(91, 140, 255, .10);
    }

    .plan h3 {
      margin: 0 0 10px;
    }

    .price {
      font-size: 25px;
      font-weight: 800;
    }

    .price small {
      font-size: 13px;
      color: #8794b3;
      font-weight: normal;
    }

    .method {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .method label {
      border: 1px solid #293652;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
    }

    .method input {
      margin-left: 8px;
    }

    .payment-number {
      background: #0b1020;
      border: 1px solid #293652;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
      text-align: center;
    }

    .payment-number strong {
      display: block;
      font-size: 25px;
      color: #63e6a5;
      direction: ltr;
      margin-top: 8px;
    }

    label.field {
      display: block;
      margin-top: 20px;
      color: #cbd5ef;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: #0b1020;
      border: 1px solid #293652;
      border-radius: 10px;
      color: white;
    }

    input[type="file"] {
      cursor: pointer;
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 25px;
      background: #5b8cff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit:hover {
      opacity: .9;
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      min-height: 24px;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .error {
      color: #ff7f91;
    }

    .success {
      color: #63e6a5;
    }

    .info {
      color: #8794b3;
      line-height: 1.8;
      margin-top: 15px;
    }

    @media (max-width: 700px) {

      .plans {
        grid-template-columns: 1fr;
      }

      .method {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 22px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div class="logo">
      Biz<span>Flow</span>
    </div>


    <!-- =========================
         PLAN
    ========================== -->

    <div class="card">

      <h1>
        اختر باقتك
      </h1>

      <p class="subtitle">
        اختر الباقة التي تريد تفعيلها.
      </p>


      <div class="plans">


        <div
          class="plan"
          data-plan="basic"
          data-price="99"
        >

          <h3>
            Basic
          </h3>

          <div class="price">
            99 ج.م
            <small>/ شهر</small>
          </div>

        </div>


        <div
          class="plan"
          data-plan="pro"
          data-price="199"
        >

          <h3>
            Pro
          </h3>

          <div class="price">
            199 ج.م
            <small>/ شهر</small>
          </div>

        </div>


        <div
          class="plan"
          data-plan="business"
          data-price="399"
        >

          <h3>
            Business
          </h3>

          <div class="price">
            399 ج.م
            <small>/ شهر</small>
          </div>

        </div>


      </div>

    </div>


    <!-- =========================
         PAYMENT
    ========================== -->

    <div class="card">

      <h2>
        طريقة الدفع
      </h2>

      <div class="method">

        <label>

          <input
            type="radio"
            name="paymentMethod"
            value="etisalat_cash"
          >

          اتصالات كاش

        </label>


        <label>

          <input
            type="radio"
            name="paymentMethod"
            value="instapay"
          >

          InstaPay

        </label>

      </div>


      <div class="payment-number">

        حوّل المبلغ إلى الرقم التالي:

        <strong>
          01125035655
        </strong>

      </div>


      <p class="info">
        بعد التحويل، ارفع صورة واضحة لإثبات الدفع.
        سيتم مراجعة التحويل وتفعيل الاشتراك بعد الموافقة.
      </p>


      <!-- Transaction ID -->

      <label class="field">

        رقم العملية
        <span style="color:#8794b3;">
          (اختياري)
        </span>

        <input
          type="text"
          id="transactionId"
          placeholder="اكتب رقم العملية إذا كان موجودًا"
        >

      </label>


      <!-- Screenshot -->

      <label class="field">

        صورة إثبات الدفع

        <input
          type="file"
          id="proof"
          accept="image/png,image/jpeg,image/webp"
        >

      </label>


      <button
        class="submit"
        id="submitBtn"
        type="button"
      >
        إرسال طلب الدفع
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://oklabfxjcekfwirnqlji.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_V-_AIpoZ2IZActUyhDQ5ug_9_Lqlugp";


    const { createClient } = supabase;


    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // =========================
    // VARIABLES
    // =========================

    let selectedPlan = null;
    let selectedPrice = null;


    const plans =
      document.querySelectorAll(".plan");


    const submitBtn =
      document.getElementById("submitBtn");


    const message =
      document.getElementById("message");


    // =========================
    // CHECK LOGIN
    // =========================

    async function checkUser() {

      const {
        data,
        error
      } = await supabaseClient.auth.getUser();


      if (error || !data.user) {

        window.location.href =
          "login.html";

        return null;

      }


      return data.user;

    }


    checkUser();


    // =========================
    // PLAN SELECTION
    // =========================

    plans.forEach((plan) => {

      plan.addEventListener(
        "click",
        () => {

          plans.forEach((item) => {

            item.classList.remove(
              "selected"
            );

          });


          plan.classList.add(
            "selected"
          );


          selectedPlan =
            plan.dataset.plan;


          selectedPrice =
            Number(plan.dataset.price);

        }
      );

    });


    // =========================
    // SUBMIT
    // =========================

    submitBtn.addEventListener(
      "click",
      async () => {

        message.textContent = "";
        message.className = "message";


        // PLAN

        if (!selectedPlan) {

          message.textContent =
            "اختر الباقة أولًا.";

          message.className =
            "message error";

          return;

        }


        // PAYMENT METHOD

        const method =
          document.querySelector(
            'input[name="paymentMethod"]:checked'
          );


        if (!method) {

          message.textContent =
            "اختر طريقة الدفع.";

          message.className =
            "message error";

          return;

        }


        // FILE

        const file =
          document.getElementById(
            "proof"
          ).files[0];


        if (!file) {

          message.textContent =
            "ارفع صورة إثبات الدفع.";

          message.className =
            "message error";

          return;

        }


        // FILE TYPE

        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp"
        ];


        if (
          !allowedTypes.includes(
            file.type
          )
        ) {

          message.textContent =
            "الصورة يجب أن تكون JPG أو PNG أو WEBP.";

          message.className =
            "message error";

          return;

        }


        // FILE SIZE

        if (
          file.size >
          5 * 1024 * 1024
        ) {

          message.textContent =
            "حجم الصورة يجب ألا يتجاوز 5MB.";

          message.className =
            "message error";

          return;

        }


        submitBtn.disabled = true;

        submitBtn.textContent =
          "جاري إرسال الطلب...";


        try {

          // USER

          const {
            data: userData,
            error: userError
          } = await supabaseClient.auth.getUser();


          if (
            userError ||
            !userData.user
          ) {

            window.location.href =
              "login.html";

            return;

          }


          const user =
            userData.user;


          // FILE NAME

          const extension =
            file.name
              .split(".")
              .pop()
              .toLowerCase();


          const fileName =
            Date.now() +
            "-" +
            crypto.randomUUID() +
            "." +
            extension;


          const filePath =
            user.id +
            "/" +
            fileName;


          // UPLOAD

          const {
            error: uploadError
          } =
            await supabaseClient.storage
              .from("payment-proofs")
              .upload(
                filePath,
                file,
                {
                  cacheControl: "3600",
                  upsert: false
                }
              );


          if (uploadError) {

            throw uploadError;

          }


          // TRANSACTION ID

          const transactionId =
            document
              .getElementById(
                "transactionId"
              )
              .value
              .trim();


          // DATABASE

          const {
            error: insertError
          } =
            await supabaseClient
              .from("payment_requests")
              .insert({

                user_id:
                  user.id,

                plan:
                  selectedPlan,

                amount:
                  selectedPrice,

                payment_method:
                  method.value,

                transaction_id:
                  transactionId ||
                  null,

                proof_path:
                  filePath,

                status:
                  "pending"

              });


          if (insertError) {

            throw insertError;

          }


          message.textContent =
            "تم إرسال طلب الدفع بنجاح. سيتم مراجعته وتفعيل الاشتراك بعد الموافقة.";

          message.className =
            "message success";


          submitBtn.textContent =
            "تم إرسال الطلب";


        } catch (error) {

          console.error(
            "Payment request error:",
            error
          );


          message.textContent =
            "حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.";

          message.className =
            "message error";


          submitBtn.disabled =
            false;

          submitBtn.textContent =
            "إرسال طلب الدفع";

        }

      }
    );

  </script>

</body>

</html>
