<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BizFlow - الدفع</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background: #0b0f17;
            color: #fff;
        }

        .container {
            width: min(650px, 92%);
            margin: auto;
            padding: 45px 0;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .logo span {
            color: #38bdf8;
        }

        .card {
            background: #111827;
            border: 1px solid #263244;
            border-radius: 18px;
            padding: 25px;
        }

        .card h1 {
            margin: 0 0 25px;
            text-align: center;
            font-size: 26px;
        }

        .selected-plan {
            background: #0b1220;
            border: 1px solid #263244;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 22px;
        }

        .selected-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 8px 0;
        }

        .selected-row:not(:last-child) {
            border-bottom: 1px solid #202b3d;
        }

        .selected-label {
            color: #94a3b8;
        }

        .selected-value {
            font-weight: 800;
            color: #38bdf8;
        }

        .payment-info {
            background: #0f172a;
            border: 1px solid #263244;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 22px;
        }

        .payment-info h3 {
            margin: 0 0 15px;
        }

        .phone {
            font-size: 25px;
            font-weight: 800;
            color: #22c55e;
            direction: ltr;
            text-align: center;
            margin: 12px 0;
        }

        .methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .method {
            border: 1px solid #334155;
            background: #111827;
            color: #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            font-weight: 700;
        }

        .method.active {
            border-color: #38bdf8;
            color: #38bdf8;
            background: #0c1d2b;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 9px;
            border: 1px solid #334155;
            background: #0b1220;
            color: white;
        }

        input[type="file"] {
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .back-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 0;
            border-radius: 10px;
            background: #334155;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #064e3b;
            color: #a7f3d0;
        }

        .message.error {
            background: #7f1d1d;
            color: #fecaca;
        }

        .note {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.7;
            margin-top: 10px;
        }

        @media (max-width: 500px) {

            .methods {
                grid-template-columns: 1fr;
            }

            .selected-row {
                flex-direction: column;
                align-items: flex-start;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Biz<span>Flow</span>
    </div>


    <div class="card">

        <h1>
            إتمام الاشتراك
        </h1>


        <!-- SELECTED PLAN -->

        <div class="selected-plan">

            <div class="selected-row">

                <span class="selected-label">
                    الباقة المختارة
                </span>

                <strong
                    class="selected-value"
                    id="selectedPlan">
                    -
                </strong>

            </div>


            <div class="selected-row">

                <span class="selected-label">
                    السعر
                </span>

                <strong
                    class="selected-value"
                    id="selectedAmount">
                    -
                </strong>

            </div>

        </div>


        <!-- PAYMENT INFO -->

        <div class="payment-info">

            <h3>
                بيانات التحويل
            </h3>

            <div>
                قم بتحويل قيمة الباقة إلى الرقم التالي:
            </div>

            <div class="phone">
                01125035655
            </div>

            <div class="note">
                يمكنك الدفع عن طريق Etisalat Cash
                أو InstaPay، وبعد التحويل ارفع صورة
                إثبات الدفع بالأسفل.
            </div>


            <div class="methods">

                <div
                    class="method active"
                    id="etisalatMethod"
                    onclick="selectMethod('etisalat_cash')">

                    Etisalat Cash

                </div>

                <div
                    class="method"
                    id="instapayMethod"
                    onclick="selectMethod('instapay')">

                    InstaPay

                </div>

            </div>

        </div>


        <!-- FORM -->

        <form id="paymentForm">

            <div class="form-group">

                <label>
                    رقم العملية
                    <span style="color:#64748b;">
                        (اختياري)
                    </span>
                </label>

                <input
                    type="text"
                    id="transactionId"
                    placeholder="اكتب رقم العملية إذا كان موجودًا">

            </div>


            <div class="form-group">

                <label>
                    صورة إثبات الدفع
                </label>

                <input
                    type="file"
                    id="proofFile"
                    accept="image/*"
                    required>

                <div class="note">
                    ارفع صورة واضحة للتحويل.
                </div>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn">

                إرسال طلب الدفع

            </button>

        </form>


        <button
            class="back-btn"
            onclick="window.location.href='plans.html'">

            ← تغيير الباقة

        </button>


        <div
            class="message"
            id="message">
        </div>

    </div>

</div>


<script>

const selectedPlan =
    localStorage.getItem(
        "selectedPlan"
    );

const selectedAmount =
    localStorage.getItem(
        "selectedAmount"
    );


const planElement =
    document.getElementById(
        "selectedPlan"
    );

const amountElement =
    document.getElementById(
        "selectedAmount"
    );


// ==========================================
// SHOW SELECTED PLAN
// ==========================================

if (selectedPlan) {

    planElement.textContent =
        selectedPlan;

} else {

    planElement.textContent =
        "-";

}


if (selectedAmount) {

    amountElement.textContent =
        Number(selectedAmount)
        .toFixed(2) + " EGP";

} else {

    amountElement.textContent =
        "-";

}


// ==========================================
// PAYMENT METHOD
// ==========================================

let selectedMethod =
    "etisalat_cash";


function selectMethod(method) {

    selectedMethod =
        method;


    document
        .getElementById(
            "etisalatMethod"
        )
        .classList.remove("active");


    document
        .getElementById(
            "instapayMethod"
        )
        .classList.remove("active");


    if (
        method ===
        "etisalat_cash"
    ) {

        document
            .getElementById(
                "etisalatMethod"
            )
            .classList.add("active");

    } else {

        document
            .getElementById(
                "instapayMethod"
            )
            .classList.add("active");

    }

}


// ==========================================
// MESSAGE
// ==========================================

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

}


// ==========================================
// PAYMENT SUBMIT
// ==========================================

document
    .getElementById(
        "paymentForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const {
                data: {
                    session
                }
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (!session) {

                window.location.href =
                    "login.html";

                return;
            }


            if (
                !selectedPlan ||
                !selectedAmount
            ) {

                showMessage(
                    "لم يتم اختيار باقة.",
                    "error"
                );

                return;
            }


            const file =
                document.getElementById(
                    "proofFile"
                ).files[0];


            if (!file) {

                showMessage(
                    "ارفع صورة إثبات الدفع.",
                    "error"
                );

                return;
            }


            const submitBtn =
                document.getElementById(
                    "submitBtn"
                );


            submitBtn.disabled =
                true;

            submitBtn.textContent =
                "جاري إرسال الطلب...";


            try {

                const userId =
                    session.user.id;


                // ==================================
                // FILE NAME
                // ==================================

                const safeName =
                    file.name
                        .replace(
                            /[^a-zA-Z0-9._-]/g,
                            "_"
                        );


                const filePath =
                    userId +
                    "/" +
                    Date.now() +
                    "-" +
                    safeName;


                // ==================================
                // UPLOAD PROOF
                // ==================================

                const {
                    error:
                    uploadError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            "payment-proofs"
                        )
                        .upload(
                            filePath,
                            file,
                            {
                                upsert: false
                            }
                        );


                if (uploadError) {

                    throw uploadError;

                }


                // ==================================
                // INSERT PAYMENT REQUEST
                // ==================================

                const {
                    error:
                    insertError
                } =
                    await supabaseClient
                        .from(
                            "payment_requests"
                        )
                        .insert({

                            user_id:
                                userId,

                            plan:
                                selectedPlan,

                            amount:
                                Number(
                                    selectedAmount
                                ),

                            payment_method:
                                selectedMethod,

                            transaction_id:
                                document
                                    .getElementById(
                                        "transactionId"
                                    )
                                    .value
                                    .trim() ||
                                null,

                            proof_path:
                                filePath

                        });


                if (insertError) {

                    throw insertError;

                }


                showMessage(
                    "تم إرسال طلب الدفع بنجاح. انتظر موافقة الإدارة.",
                    "success"
                );


                // منع إرسال طلب ثاني بالغلط
                submitBtn.textContent =
                    "تم إرسال الطلب ✓";


                // تنظيف البيانات بعد نجاح الطلب
                localStorage.removeItem(
                    "selectedPlan"
                );

                localStorage.removeItem(
                    "selectedAmount"
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "حدث خطأ أثناء إرسال الطلب.",
                    "error"
                );


                submitBtn.disabled =
                    false;

                submitBtn.textContent =
                    "إرسال طلب الدفع";

            }

        }
    );

</script>

</body>
</html>
