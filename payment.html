<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BizFlow - الدفع</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(59,130,246,.15), transparent 35%),
                radial-gradient(circle at bottom left, rgba(16,185,129,.10), transparent 35%),
                #0b1020;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: #60a5fa;
        }

        .card {
            background: rgba(18, 25, 43, .96);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            margin: 0 0 8px;
            font-size: 27px;
        }

        .title p {
            margin: 0;
            color: #94a3b8;
        }

        .plan-box {
            background: rgba(37, 99, 235, .10);
            border: 1px solid rgba(96,165,250,.25);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .plan-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .plan-row:last-child {
            margin-bottom: 0;
        }

        .plan-row .label {
            color: #94a3b8;
        }

        .plan-row .value {
            font-weight: bold;
            color: #fff;
        }

        .amount {
            font-size: 25px;
            color: #60a5fa !important;
        }

        .section {
            margin-top: 25px;
        }

        .section-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .method {
            border: 1px solid #334155;
            background: #111827;
            color: #cbd5e1;
            border-radius: 13px;
            padding: 15px;
            cursor: pointer;
            font-size: 15px;
            transition: .2s;
        }

        .method:hover {
            border-color: #60a5fa;
        }

        .method.active {
            border-color: #60a5fa;
            background: rgba(59,130,246,.15);
            color: #fff;
            box-shadow: 0 0 0 1px rgba(96,165,250,.15);
        }

        .method-icon {
            display: block;
            font-size: 24px;
            margin-bottom: 7px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            padding: 13px;
            outline: none;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            border-color: #60a5fa;
        }

        .info {
            background: rgba(245,158,11,.08);
            border: 1px solid rgba(245,158,11,.25);
            color: #fcd34d;
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
            line-height: 1.7;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            border: 0;
            border-radius: 13px;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            transition: .2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 14px;
            border-radius: 12px;
            margin-top: 18px;
            text-align: center;
            line-height: 1.6;
        }

        .message.success {
            display: block;
            background: rgba(16,185,129,.10);
            border: 1px solid rgba(16,185,129,.3);
            color: #6ee7b7;
        }

        .message.error {
            display: block;
            background: rgba(239,68,68,.10);
            border: 1px solid rgba(239,68,68,.3);
            color: #fca5a5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #fff;
        }

        .selected-file {
            margin-top: 8px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            .methods {
                grid-template-columns: 1fr;
            }

            .logo h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>Biz<span>Flow</span></h1>
    </div>

    <div class="card">

        <div class="title">
            <h2>إتمام الدفع</h2>
            <p>أكمل بيانات الدفع لإرسال طلب الاشتراك</p>
        </div>

        <div class="plan-box">

            <div class="plan-row">
                <span class="label">الباقة</span>
                <span class="value" id="planName">-</span>
            </div>

            <div class="plan-row">
                <span class="label">السعر</span>
                <span class="value amount" id="planAmount">-</span>
            </div>

        </div>

        <form id="paymentForm">

            <div class="section">

                <div class="section-title">
                    طريقة الدفع
                </div>

                <div class="methods">

                    <button
                        type="button"
                        class="method active"
                        id="etisalatMethod"
                    >
                        <span class="method-icon">📱</span>
                        Etisalat Cash
                    </button>

                    <button
                        type="button"
                        class="method"
                        id="instapayMethod"
                    >
                        <span class="method-icon">💳</span>
                        InstaPay
                    </button>

                </div>

            </div>

            <div class="info" id="paymentInfo">
                قم بتحويل قيمة الاشتراك إلى وسيلة الدفع المحددة، ثم ارفع صورة إثبات الدفع.
            </div>

            <div class="section">

                <label for="transactionId">
                    رقم العملية / Transaction ID
                </label>

                <input
                    type="text"
                    id="transactionId"
                    placeholder="اكتب رقم العملية إن وجد"
                >

            </div>

            <div class="section">

                <label for="proofFile">
                    صورة إثبات الدفع
                </label>

                <input
                    type="file"
                    id="proofFile"
                    accept="image/*"
                    required
                >

                <div class="selected-file" id="selectedFile">
                    لم يتم اختيار ملف
                </div>

            </div>

            <button
                type="submit"
                class="submit-btn"
                id="submitButton"
            >
                إرسال طلب الدفع
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>

        <a href="plans.html" class="back">
            ← العودة إلى الباقات
        </a>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", async function () {

    const paymentSupabase =
        window.BizFlowAuth?.supabaseClient;

    if (!paymentSupabase) {
        console.error("Supabase client not found.");

        showMessage(
            "حدث خطأ في الاتصال بالنظام.",
            "error"
        );

        return;
    }

    const PLAN_PRICES = {
        Basic: 99,
        Pro: 199,
        Business: 399
    };

    const selectedPlan =
        localStorage.getItem("selectedPlan");

    const storedAmount =
        localStorage.getItem("selectedAmount");

    const planNameElement =
        document.getElementById("planName");

    const planAmountElement =
        document.getElementById("planAmount");

    const paymentForm =
        document.getElementById("paymentForm");

    const submitButton =
        document.getElementById("submitButton");

    const etisalatButton =
        document.getElementById("etisalatMethod");

    const instapayButton =
        document.getElementById("instapayMethod");

    const transactionInput =
        document.getElementById("transactionId");

    const proofFile =
        document.getElementById("proofFile");

    const selectedFileElement =
        document.getElementById("selectedFile");

    let selectedMethod = "etisalat_cash";


    // =========================
    // التحقق من تسجيل الدخول
    // =========================

    const {
        data: userData,
        error: userError
    } = await paymentSupabase.auth.getUser();

    if (
        userError ||
        !userData ||
        !userData.user
    ) {
        window.location.href = "login.html";
        return;
    }


    // =========================
    // التحقق من الباقة
    // =========================

    if (
        !selectedPlan ||
        !PLAN_PRICES[selectedPlan]
    ) {

        showMessage(
            "لم يتم اختيار باقة صحيحة. سيتم تحويلك إلى صفحة الباقات.",
            "error"
        );

        setTimeout(function () {
            window.location.href = "plans.html";
        }, 1500);

        return;
    }


    const actualAmount =
        PLAN_PRICES[selectedPlan];


    // =========================
    // عرض الباقة
    // =========================

    planNameElement.textContent =
        selectedPlan;

    planAmountElement.textContent =
        actualAmount + " جنيه";


    // =========================
    // اختيار Etisalat Cash
    // =========================

    etisalatButton.onclick = function () {

        selectPaymentMethod("etisalat_cash");

    };


    // =========================
    // اختيار InstaPay
    // =========================

    instapayButton.onclick = function () {

        selectPaymentMethod("instapay");

    };


    function selectPaymentMethod(method) {

        selectedMethod = method;

        etisalatButton.classList.remove("active");
        instapayButton.classList.remove("active");

        if (method === "etisalat_cash") {

            etisalatButton.classList.add("active");

            document.getElementById("paymentInfo").textContent =
                "قم بتحويل قيمة الاشتراك عن طريق Etisalat Cash، ثم ارفع صورة إثبات الدفع.";

        } else {

            instapayButton.classList.add("active");

            document.getElementById("paymentInfo").textContent =
                "قم بتحويل قيمة الاشتراك عن طريق InstaPay، ثم ارفع صورة إثبات الدفع.";

        }

    }


    // =========================
    // عرض اسم الملف
    // =========================

    proofFile.onchange = function () {

        if (proofFile.files.length > 0) {

            selectedFileElement.textContent =
                "الملف المختار: " +
                proofFile.files[0].name;

        } else {

            selectedFileElement.textContent =
                "لم يتم اختيار ملف";

        }

    };


    // =========================
    // إرسال الطلب
    // =========================

    paymentForm.onsubmit = async function (event) {

        event.preventDefault();


        if (
            !proofFile.files ||
            proofFile.files.length === 0
        ) {

            showMessage(
                "من فضلك ارفع صورة إثبات الدفع.",
                "error"
            );

            return;

        }


        const file =
            proofFile.files[0];


        // السماح بالصور فقط
        if (
            !file.type.startsWith("image/")
        ) {

            showMessage(
                "من فضلك اختر صورة صحيحة لإثبات الدفع.",
                "error"
            );

            return;

        }


        // الحد الأقصى 10MB
        if (
            file.size > 10 * 1024 * 1024
        ) {

            showMessage(
                "حجم الصورة يجب ألا يتجاوز 10MB.",
                "error"
            );

            return;

        }


        submitButton.disabled = true;

        submitButton.textContent =
            "جاري إرسال الطلب...";


        try {

            const {
                data: currentUserData,
                error: currentUserError
            } = await paymentSupabase.auth.getUser();


            if (
                currentUserError ||
                !currentUserData ||
                !currentUserData.user
            ) {

                throw new Error(
                    "يجب تسجيل الدخول أولاً."
                );

            }


            const user =
                currentUserData.user;


            // =========================
            // اسم الملف
            // =========================

            const originalName =
                file.name
                .replace(/[^\w.\-]/g, "_");


            const timestamp =
                Date.now();


            const filePath =
                user.id +
                "/" +
                timestamp +
                "-" +
                originalName;


            // =========================
            // رفع صورة الإثبات
            // =========================

            const {
                error: uploadError
            } = await paymentSupabase
                .storage
                .from("payment-proofs")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );


            if (uploadError) {

                console.error(
                    "Upload error:",
                    uploadError
                );

                throw new Error(
                    "فشل رفع صورة إثبات الدفع: " +
                    uploadError.message
                );

            }


            // =========================
            // إرسال طلب الدفع
            // =========================

            const transactionId =
                transactionInput.value.trim();


            const {
                data: requestData,
                error: requestError
            } = await paymentSupabase
                .rpc(
                    "submit_payment_request",
                    {
                        p_plan: selectedPlan,
                        p_amount: actualAmount,
                        p_payment_method: selectedMethod,
                        p_transaction_id:
                            transactionId || null,
                        p_proof_path:
                            filePath
                    }
                );


            if (requestError) {

                console.error(
                    "Payment request error:",
                    requestError
                );

                throw new Error(
                    requestError.message
                );

            }


            console.log(
                "Payment request created:",
                requestData
            );


            // =========================
            // نجاح الطلب
            // =========================

            showMessage(
                "✅ تم إرسال طلب الدفع بنجاح. جاري تحويلك إلى صفحة الانتظار...",
                "success"
            );


            submitButton.textContent =
                "تم إرسال الطلب ✓";

            submitButton.disabled =
                true;


            localStorage.removeItem(
                "selectedPlan"
            );

            localStorage.removeItem(
                "selectedAmount"
            );


            // التحويل إلى صفحة الانتظار
            setTimeout(function () {

                window.location.href =
                    "payment-pending.html";

            }, 1000);


        } catch (error) {

            console.error(
                "Payment error:",
                error
            );


            showMessage(
                "❌ حدث خطأ: " +
                error.message,
                "error"
            );


            submitButton.disabled =
                false;

            submitButton.textContent =
                "إرسال طلب الدفع";

        }

    };


    // =========================
    // رسالة
    // =========================

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById("message");

        message.textContent =
            text;

        message.className =
            "message " + type;

    }

});

</script>

</body>
</html>
