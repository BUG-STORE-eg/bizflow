<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BizFlow - إنشاء حساب</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: #151923;
            border: 1px solid #252a36;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo span {
            color: #4f8cff;
        }

        .subtitle {
            text-align: center;
            color: #8f97a8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b8beca;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            background: #0f1117;
            border: 1px solid #2a3040;
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #4f8cff;
        }

        button {
            width: 100%;
            border: 0;
            padding: 14px;
            border-radius: 10px;
            background: #4f8cff;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .error,
        .success {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .error {
            background: #3b2024;
            color: #ff9ca5;
        }

        .success {
            background: #173526;
            color: #8de0ad;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #8f97a8;
        }

        .login a {
            color: #4f8cff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        Biz<span>Flow</span>
    </div>

    <div class="subtitle">
        إنشاء حساب جديد
    </div>

    <div id="errorBox" class="error"></div>

    <div id="successBox" class="success"></div>

    <form id="registerForm">

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            id="email"
            type="email"
            placeholder="example@gmail.com"
            required
            autocomplete="email"
        >

        <label for="password">
            كلمة المرور
        </label>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            required
            minlength="6"
            autocomplete="new-password"
        >

        <label for="confirmPassword">
            تأكيد كلمة المرور
        </label>

        <input
            id="confirmPassword"
            type="password"
            placeholder="أعد كتابة كلمة المرور"
            required
            minlength="6"
            autocomplete="new-password"
        >

        <button
            id="registerBtn"
            type="submit"
        >
            إنشاء الحساب
        </button>

    </form>

    <div class="login">
        لديك حساب بالفعل؟
        <a href="login.html">
            تسجيل الدخول
        </a>
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://oklabfxjcekfwirnqlji.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_V-_AIpoZ2IZActUyhDQ5ug_9_Lqlugp";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById("registerForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const registerBtn =
    document.getElementById("registerBtn");

const errorBox =
    document.getElementById("errorBox");

const successBox =
    document.getElementById("successBox");


function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

    successBox.style.display = "none";
}


function showSuccess(message) {

    successBox.textContent = message;

    successBox.style.display = "block";

    errorBox.style.display = "none";
}


form.addEventListener("submit", async function (event) {

    event.preventDefault();

    errorBox.style.display = "none";

    successBox.style.display = "none";


    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;


    if (password !== confirmPassword) {

        showError(
            "كلمتا المرور غير متطابقتين."
        );

        return;
    }


    if (password.length < 6) {

        showError(
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
        );

        return;
    }


    registerBtn.disabled = true;

    registerBtn.textContent =
        "جاري إنشاء الحساب...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password

        });


    if (error) {

        showError(
            error.message
        );

        registerBtn.disabled = false;

        registerBtn.textContent =
            "إنشاء الحساب";

        return;
    }


    /*
        Confirm Email لازم يكون OFF من Supabase.
        بعد إنشاء الحساب نذهب مباشرة إلى الباقات.
    */

    if (data.user) {

        showSuccess(
            "تم إنشاء الحساب. جاري تحويلك إلى الباقات..."
        );

        setTimeout(() => {

            window.location.href =
                "plans.html";

        }, 700);

        return;
    }


    showError(
        "تم إنشاء الحساب ولكن لم يتم تسجيل الدخول تلقائيًا. حاول تسجيل الدخول."
    );

    registerBtn.disabled = false;

    registerBtn.textContent =
        "إنشاء الحساب";

});

</script>

</body>
</html>
